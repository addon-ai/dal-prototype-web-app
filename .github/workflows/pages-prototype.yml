name: Pages — prototype

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'openspec/**'
      - '**.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prototype
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html no existe"
            exit 1
          fi
      - name: Syntax check (node --check)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "::error file=$f::Error de sintaxis"; status=1; }
          done < <(find js -name '*.js' -print0)
          exit $status
      - name: No network APIs or lint suppressions
        run: |
          if grep -rnE --include='*.js' 'fetch\(|XMLHttpRequest|WebSocket|EventSource|eslint-disable' js; then
            echo "::error::Se encontraron APIs de red o eslint-disable en js/**/*.js"
            exit 1
          fi
      - name: No test files
        run: |
          found=$(find . -path ./.git -prune -o \( -name '*.test.js' -o -name '*.spec.js' \) -print)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::El repo no debe contener archivos *.test.js ni *.spec.js"
            exit 1
          fi
      - name: Relative paths only in index.html
        run: |
          if grep -nE '(src|href)="/' index.html; then
            echo "::error::index.html usa rutas absolutas; usar rutas relativas (./)"
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
