<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163a65" />
    <meta
      name="description"
      content="Prototipo de ejemplo: asistente de seguimiento de envíos y atención de reclamos con datos ilustrativos."
    />
    <title>Asistente de envíos</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <script>
      /* Anti-FOUC: aplica el tema guardado antes del primer pintado. */
      (function () {
        try {
          var saved = window.localStorage.getItem('dal-proto-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (error) {
          /* localStorage no disponible: se queda el tema claro. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Noto+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/canvas.css" />
    <link rel="stylesheet" href="./css/panels.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <header class="app-header">
      <div class="brand">
        <img
          class="brand__logo brand__logo--light"
          src="./assets/logo-sidebar.svg"
          alt="DAL Platform"
        />
        <img
          class="brand__logo brand__logo--dark"
          src="./assets/logo-sidebar-dark.svg"
          alt="DAL Platform"
        />
      </div>

      <nav class="main-nav" aria-label="Secciones">
        <ul class="main-nav__list">
          <li>
            <button type="button" class="main-nav__btn" data-view="constructor" aria-current="page">
              Constructor
            </button>
          </li>
          <li>
            <button type="button" class="main-nav__btn" data-view="resultados">Resultados</button>
          </li>
          <li>
            <button type="button" class="main-nav__btn" data-view="narrativa">Narrativa</button>
          </li>
        </ul>
      </nav>

      <button
        type="button"
        id="theme-toggle"
        class="btn theme-toggle"
        aria-pressed="false"
        aria-label="Cambiar a modo oscuro"
      >
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    <main id="main" class="app-main">
      <div
        id="live"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <section id="view-constructor" class="view" aria-labelledby="constructor-title">
        <div class="view__head">
          <h1 id="constructor-title" tabindex="-1">Asistente de seguimiento de envíos</h1>
          <p>
            Atención de consultas y reclamos de clientes. Arrastra pasos, conéctalos y ajusta el
            asistente.
          </p>
          <p class="tag" id="scenario-tag">Empresa y proceso de ejemplo: a definir en sesión 2</p>
          <div>
            <button type="button" id="restore-template" class="btn">Restaurar plantilla</button>
          </div>
        </div>

        <div class="builder">
          <aside id="palette" class="palette" aria-label="Pasos disponibles">
            <button
              type="button"
              id="palette-toggle"
              class="btn btn--primary palette__toggle"
              aria-expanded="false"
              aria-controls="palette-list"
            >
              Agregar un paso
            </button>
            <ul id="palette-list" class="palette__list"></ul>
          </aside>

          <div id="canvas-wrap" class="canvas-wrap"></div>

          <aside
            id="inspector"
            class="panel builder__inspector"
            aria-label="Ajustes del paso"
          ></aside>
        </div>

        <details id="recipe" class="recipe">
          <summary>Receta técnica (para TI)</summary>
          <div id="recipe-body" class="recipe__body"></div>
        </details>
      </section>

      <section id="view-resultados" class="view" aria-labelledby="resultados-title" hidden>
        <h1 id="resultados-title" tabindex="-1">Resultados y costos</h1>
        <div id="stats"></div>
        <div id="costs"></div>
      </section>

      <section id="view-narrativa" class="view" aria-labelledby="narrativa-title" hidden>
        <div id="narrative"></div>
      </section>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
